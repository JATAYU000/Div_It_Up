<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="app">Loading.....</div>
    <template id="login">
        <h1>Bank App</h1>
        <section>
          <a href="/dashboard" onclick="onLinkClick(event)">Login</a>
        </section>
    </template>
    <template id="dashboard">
        <header>
          <h1>Bank App</h1>
          <a href="/login" onclick="onLinkClick(event)">Logout</a><br>
          <a href="/credits" onclick="onLinkClick(event)">Credits</a>
        </header>
        <section>
          Balance: 100$
        </section>
        <section>
          <h2>Transactions</h2>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Object</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
    </template>
    <template id="credits">
        <header>
            <h1>Bank App</h1>
            <a href="/dashboard" onclick="onLinkClick(event)">Back</a><br>
            <a href="/login" onclick="onLinkClick(event)">Logout</a>
        </header>
    </template>
  </body>
</html>
