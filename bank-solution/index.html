<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="app">Loading.....</div>
    <template id="login">
        <h1>Bank App</h1>
        <section>
          <h2>Login</h2>
          <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="user" type="text">
            <button>Login</button>
          </form>
          <hr/>
          <h2>Register</h2>
          <form id="registerForm">
            <label for="user">Username</label>
            <input id="user" name="user" type="text">
            <label for="currency">Currency</label>
            <input id="currency" name="currency" type="text" value="$ 0">
            <label for="description">Description</label>
            <input id="description" name="description" type="text">
            <label for="balance">Current balance</label>
            <input id="balance" name="balance" type="number" value="0">
            <button>Register</button>
          </form>
        </section>
    </template>
    <template id="dashboard">
        <header>
          <h1>Bank App</h1>
          <a href="/login" onclick="onLinkClick(event)">Logout</a><br>
          <a href="/credits" onclick="onLinkClick(event)">Credits</a>
        </header>
        <section>
          Balance: 100$
        </section>
        <section>
          <h2>Transactions</h2>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Object</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
    </template>
    <template id="credits">
        <header>
            <h1>Bank App</h1>
            <a href="/dashboard" onclick="onLinkClick(event)">Back</a><br>
            <a href="/login" onclick="onLinkClick(event)">Logout</a>
        </header>
    </template>
  </body>
</html>
